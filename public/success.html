<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Оплата пройшла успішно</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17141a;--surface:#201b24;--border:#322b38;--text:#f4eef0;--muted:#a89ba3;--accent:#d99aa0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100%}body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px}.card{width:100%;max-width:470px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:48px 36px}.icon{width:52px;height:52px;border-radius:50%;background:rgba(217,154,160,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}h1{font-family:Fraunces,serif;font-weight:500;font-size:24px;margin:0 0 12px;text-align:center}p{font-size:14.5px;line-height:1.6;color:var(--muted);margin:0 0 7px;text-align:center}.details{margin-top:26px;padding:18px;border:1px solid var(--border);border-radius:12px}.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:13px}.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;word-break:break-all}.ok{color:var(--accent)!important}.hint{margin-top:20px;font-size:12px}.customer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7f747f!important}
</style>
</head>
<body><div class="card"><div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M20 6.5L9 17.5L4 12.5" stroke="#d99aa0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>Оплата пройшла успішно</h1><p>Дякуємо! Ми отримали ваш початковий платіж.</p><p>Спосіб оплати збережено у вашому Stripe Customer для можливого подальшого списання $35 після виконання послуги.</p><div class="details" id="details" style="display:none"><div class="row"><span>Статус</span><span class="ok" id="status">—</span></div><div class="row"><span>Customer ID</span><span class="customer" id="customer">—</span></div><div class="row"><span>Платіж</span><span class="customer" id="pi">—</span></div></div><p class="hint">Не закривайте цю сторінку, якщо вам потрібно передати Customer ID менеджеру.</p></div>
<script>
(async()=>{const sessionId=new URLSearchParams(location.search).get('session_id');if(!sessionId)return;try{const r=await fetch('/api/session-info?session_id='+encodeURIComponent(sessionId));const d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('details').style.display='block';document.getElementById('status').textContent=d.paymentStatus==='paid'?'Оплачено':'Статус: '+d.paymentStatus;document.getElementById('customer').textContent=d.customerId||'—';document.getElementById('pi').textContent=d.paymentIntentId||'—'}catch(e){console.error(e)}})();
</script></body></html>
