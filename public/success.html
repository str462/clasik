<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Оплата пройшла успішно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17141a;
    --surface: #201b24;
    --surface-border: #322b38;
    --text-primary: #f4eef0;
    --text-muted: #a89ba3;
    --accent: #d99aa0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 18px;
    padding: 48px 36px;
    text-align: center;
  }
  .icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(217, 154, 160, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 12px;
  }
  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0 0 6px;
  }
  .session {
    margin-top: 20px;
    font-size: 12px;
    color: #6f6672;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M20 6.5L9 17.5L4 12.5" stroke="#d99aa0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Оплата пройшла успішно</h1>
    <p>Дякуємо! Ми отримали ваш платіж.</p>
    <p>Подальші деталі щодо послуги ви отримаєте окремо.</p>
    <p class="session" id="session-id"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('session-id').textContent = 'ID сесії: ' + sessionId;
    }
  </script>
</body>
</html>
