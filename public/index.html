<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Преміум доступ — Оплата</title>
<meta name="description" content="Безпечна оплата" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17141a;
    --surface: #201b24;
    --surface-border: #322b38;
    --text-primary: #f4eef0;
    --text-muted: #a89ba3;
    --accent: #d99aa0;
    --accent-deep: #c97e86;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 18px;
    padding: 44px 36px 36px;
    position: relative;
  }

  .kicker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 0 0 14px;
    font-weight: 500;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 25px;
    line-height: 1.3;
    margin: 0 0 32px;
    color: var(--text-primary);
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-size: 52px;
    font-weight: 600;
    line-height: 1;
  }

  .price-meta {
    font-size: 14px;
    color: var(--text-muted);
  }

  .divider {
    height: 1px;
    background: var(--surface-border);
    margin: 28px 0;
  }

  ul.features {
    list-style: none;
    padding: 0;
    margin: 0 0 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  ul.features li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  ul.features li svg {
    flex-shrink: 0;
    margin-top: 2px;
  }

  button#checkout-button {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #2a1418;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button#checkout-button:hover {
    background: var(--accent-deep);
  }

  button#checkout-button:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 3px;
  }

  button#checkout-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .note {
    margin-top: 20px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-muted);
    text-align: center;
  }

  .error {
    margin-top: 14px;
    font-size: 13px;
    color: #e2897f;
    text-align: center;
    display: none;
  }

  @media (max-width: 420px) {
    .card { padding: 38px 24px 28px; }
    .price { font-size: 44px; }
  }
</style>
</head>
<body>

<div class="card">
  <p class="kicker">
    <svg width="14" height="13" viewBox="0 0 16 14" fill="none" aria-hidden="true">
      <path d="M8 13C8 13 1 9 1 4.5C1 2.6 2.6 1 4.5 1C6 1 7.3 1.9 8 3.1C8.7 1.9 10 1 11.5 1C13.4 1 15 2.6 15 4.5C15 9 8 13 8 13Z" stroke="#d99aa0" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
    Преміум доступ
  </p>
  <h1 id="main-heading">Отримайте доступ до послуги</h1>

  <div class="price-row">
    <span class="price" id="price-display">$5</span>
    <span class="price-meta">USD · одноразово</span>
  </div>

  <div class="divider"></div>

  <ul class="features">
    <li>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5L6 12L2.5 8.5" stroke="#d99aa0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Захищена обробка платежу
    </li>
    <li>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5L6 12L2.5 8.5" stroke="#d99aa0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Миттєве підтвердження оплати
    </li>
    <li>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5L6 12L2.5 8.5" stroke="#d99aa0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Конфіденційна оплата карткою
    </li>
  </ul>

  <button id="checkout-button">Оплатити $5</button>
  <p class="error" id="error-message">Не вдалося перейти до оплати. Спробуйте ще раз.</p>

  <p class="note" id="note-text">
    $5 — початковий одноразовий платіж. Додаткові послуги оплачуються окремо.
  </p>
</div>

<script>
  // Reads ?amount=NN from the link so you can send the same page with a
  // different price per client. Falls back to $5 if missing/invalid.
  const DEFAULT_AMOUNT = 5;
  const params = new URLSearchParams(window.location.search);
  const rawAmount = parseFloat(params.get('amount'));
  const amount = (Number.isFinite(rawAmount) && rawAmount > 0) ? rawAmount : DEFAULT_AMOUNT;
  const amountLabel = Number.isInteger(amount) ? amount.toString() : amount.toFixed(2);

  document.getElementById('price-display').textContent = `$${amountLabel}`;
  document.getElementById('checkout-button').textContent = `Оплатити $${amountLabel}`;
  document.getElementById('note-text').textContent =
    `$${amountLabel} — початковий одноразовий платіж. Додаткові послуги оплачуються окремо.`;

  const button = document.getElementById('checkout-button');
  const errorMessage = document.getElementById('error-message');

  button.addEventListener('click', async () => {
    button.disabled = true;
    const originalLabel = button.textContent;
    button.textContent = 'Перехід до оплати…';
    errorMessage.style.display = 'none';

    try {
      const response = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount }),
      });

      if (!response.ok) {
        throw new Error('Request failed');
      }

      const data = await response.json();

      if (data.url) {
        window.location.href = data.url;
      } else {
        throw new Error('No checkout URL returned');
      }
    } catch (err) {
      console.error(err);
      errorMessage.style.display = 'block';
      button.disabled = false;
      button.textContent = originalLabel;
    }
  });
</script>

</body>
</html>
